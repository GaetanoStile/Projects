<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Ornate frame border -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8941f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer frame -->
  <rect x="5" y="5" width="190" height="290" rx="8" fill="none" stroke="url(#goldGradient)" stroke-width="3" />
  <!-- Inner frame -->
  <rect x="15" y="15" width="170" height="270" rx="6" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.6" />
  
  <!-- Corner flourishes -->
  <circle cx="20" cy="20" r="3" fill="url(#goldGradient)" />
  <circle cx="180" cy="20" r="3" fill="url(#goldGradient)" />
  <circle cx="20" cy="280" r="3" fill="url(#goldGradient)" />
  <circle cx="180" cy="280" r="3" fill="url(#goldGradient)" />
</svg>

